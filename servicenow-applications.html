  scrum:{es:{eyebrow:"PRÓXIMAMENTE · GESTIÓN DE PROYECTOS",title:"Gestor de sprints Scrum",body:"Estamos preparando una herramienta de gestión de sprints para organizar equipos, objetivos y entregables.",cta:"Ver otras herramientas"},en:{eyebrow:"COMING SOON · PROJECT MANAGEMENT",title:"Scrum Sprint Manager",body:"A simple sprint management tool for teams, objectives and deliverables is in preparation.",cta:"Explore other tools"}},
  domains:{es:{eyebrow:"PRÓXIMAMENTE · SERVICIOS WEB",title:"Compra de dominios",body:"Estamos preparando nuestro servicio de dominios. Pronto podrás conocer las opciones disponibles desde esta página.",cta:"Ver servicios web"},en:{eyebrow:"COMING SOON · WEB SERVICES",title:"Purchase Domains",body:"Our domain services are in preparation. You will soon be able to explore the available options here.",cta:"Explore web services"}}
};
let key=document.body.dataset.service||new URLSearchParams(location.search).get('service')||'applications';if(!copy[key])key='applications';
let lang='es';try{lang=localStorage.getItem('influnicLang')||'es'}catch(e){}if(!['es','en'].includes(lang))lang='es';
function setLang(next){lang=next;document.documentElement.lang=lang;const t=copy[key][lang];document.title=t.title+' | Influnic';for(const name of ['eyebrow','title','body','cta'])document.querySelector('[data-text='+name+']').textContent=t[name];document.querySelectorAll('[data-lang]').forEach(btn=>btn.setAttribute('aria-pressed',String(btn.dataset.lang===lang)));try{localStorage.setItem('influnicLang',lang)}catch(e){}}
document.querySelectorAll('[data-lang]').forEach(btn=>btn.addEventListener('click',()=>setLang(btn.dataset.lang)));setLang(lang);document.getElementById('year').textContent=new Date().getFullYear();</script></body></html>
